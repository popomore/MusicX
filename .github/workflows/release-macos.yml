name: Release macOS

# Keep this workflow's identity: its run number allocates every channel's build number.
on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful push run of macOS CI for this exact branch and SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-macos
  cancel-in-progress: false
  queue: max

env:
  CARGO_INCREMENTAL: '0'
  MACOSX_DEPLOYMENT_TARGET: '14.0'
  DMG: target/distribution/MusicX-macos-arm64.dmg
  RELEASE_PLAN: target/release-plan/plan.json
  CI_RUN_ID: ${{ inputs.ci_run_id }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # semantic-release verifies push access even in dry-run mode.
      actions: read
    outputs:
      branch: ${{ steps.source.outputs.branch }}
      source-sha: ${{ steps.source.outputs.source-sha }}
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
      channel: ${{ steps.plan.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Verify CI provenance before checking out source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release-source.py "$CI_RUN_ID"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.source-sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.13.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Find the original plan on retries
        id: saved
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/find-release-artifact.py release-plan
      - if: steps.saved.outputs.exists == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ steps.saved.outputs.id }}
          path: target/release-plan
      - name: Plan the semantic version and release notes
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.source-sha }}
          RELEASE_BRANCH: ${{ steps.source.outputs.branch }}
        run: node scripts/semantic-release/run.mjs plan
      - if: steps.plan.outputs.release == 'true' && steps.saved.outputs.exists != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-plan
          path: target/release-plan/plan.json
          if-no-files-found: error
          retention-days: 90

  build:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    environment: ${{ needs.plan.outputs.branch == 'main' && 'macos-preview' || 'macos-stable' }}
    permissions:
      contents: read
      actions: read
    env:
      SOURCE_SHA: ${{ needs.plan.outputs.source-sha }}
      RELEASE_BRANCH: ${{ needs.plan.outputs.branch }}
      NOTARY_RECEIPT: target/notary-input/submission.json
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source-sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-plan
          path: target/release-plan
      - run: python3 scripts/release-artifacts.py env
      - name: Find the original signed artifacts
        id: saved
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/find-release-artifact.py musicx-macos-validated
      - if: steps.saved.outputs.exists == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ steps.saved.outputs.id }}
          path: target/distribution
      - name: Find the original notarization input
        if: steps.saved.outputs.exists != 'true' && env.SIGNING_MODE == 'developer-id'
        id: notary_input
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/find-release-artifact.py musicx-macos-notary-input
      - if: steps.notary_input.outputs.exists == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ steps.notary_input.outputs.id }}
          path: target
      - name: Verify the original notarization input
        if: steps.notary_input.outputs.exists == 'true'
        run: python3 scripts/notarize-macos.py verify "$DMG"
      - name: Refuse to rebuild an existing tag
        if: steps.saved.outputs.exists != 'true'
        run: |
          test -z "$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")" || {
            echo '::error::The tag already exists. Recover the original run and its signed artifacts.'
            exit 1
          }
      - name: Install Rust
        if: steps.saved.outputs.exists != 'true' && steps.notary_input.outputs.exists != 'true'
        run: rustup toolchain install --no-self-update
      - name: Require Apple signing and iCloud authorization
        if: steps.saved.outputs.exists != 'true' && steps.notary_input.outputs.exists != 'true' && env.SIGNING_MODE == 'developer-id'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          MUSICX_ICLOUD_CONTAINER: ${{ vars.MUSICX_ICLOUD_CONTAINER }}
          ICLOUD_PROVISION_PROFILE: ${{ secrets.ICLOUD_PROVISION_PROFILE }}
        run: bash scripts/select-macos-signing.sh
      - name: Import Developer ID certificate
        if: steps.saved.outputs.exists != 'true' && steps.notary_input.outputs.exists != 'true' && env.SIGNING_MODE == 'developer-id'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          MUSICX_ICLOUD_CONTAINER: ${{ vars.MUSICX_ICLOUD_CONTAINER }}
          ICLOUD_PROVISION_PROFILE: ${{ secrets.ICLOUD_PROVISION_PROFILE }}
        run: python3 scripts/import-release-signing.py developer-id
      # No PR caches or artifacts are restored in credential-bearing jobs.
      - name: Package Apple Silicon DMG
        if: steps.saved.outputs.exists != 'true' && steps.notary_input.outputs.exists != 'true'
        env:
          MUSICX_SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: |
          test "$(uname -m)" = arm64
          : "${MUSICX_SPARKLE_PUBLIC_KEY:?Configure the Sparkle public key variable}"
          sh scripts/package-macos.sh "$DMG"
          hdiutil verify "$DMG"
      - name: Submit notarization and record the original input
        if: steps.saved.outputs.exists != 'true' && steps.notary_input.outputs.exists != 'true' && env.SIGNING_MODE == 'developer-id'
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: python3 scripts/notarize-macos.py submit "$DMG"
      - name: Preserve the signed notarization input before waiting
        if: steps.saved.outputs.exists != 'true' && steps.notary_input.outputs.exists != 'true' && env.SIGNING_MODE == 'developer-id'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: musicx-macos-notary-input
          path: |
            ${{ env.DMG }}
            ${{ env.NOTARY_RECEIPT }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 90
      - name: Wait for the original notarization and staple the DMG
        if: steps.saved.outputs.exists != 'true' && env.SIGNING_MODE == 'developer-id'
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: python3 scripts/notarize-macos.py wait "$DMG"
      - name: Preserve notarization status
        if: always() && steps.saved.outputs.exists != 'true' && env.SIGNING_MODE == 'developer-id'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notary-status-${{ github.run_attempt }}
          path: target/notary-input/status.json
          if-no-files-found: warn
          retention-days: 90
      - name: Write checksum and signed automatic update feeds
        if: steps.saved.outputs.exists != 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          MUSICX_SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          : "${SPARKLE_PRIVATE_KEY:?Configure the Sparkle private key environment secret}"
          (cd "$(dirname "$DMG")" && shasum -a 256 "$(basename "$DMG")" > "$(basename "$DMG").sha256")
          brew list --versions openssl@3 >/dev/null || brew install openssl@3
          bash scripts/generate-appcast.sh "$DMG"
          bash scripts/generate-update-feed.sh "$DMG"
          python3 scripts/release-artifacts.py record
      - run: python3 scripts/release-artifacts.py verify
      - if: steps.saved.outputs.exists != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: musicx-macos-validated
          path: |
            ${{ env.DMG }}
            ${{ env.DMG }}.sha256
            target/distribution/appcast.xml
            target/distribution/appcast-all.xml
            target/distribution/appcast-all.base
            target/distribution/validated-artifacts.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 90
      - name: Remove signing material
        if: always()
        run: |
          if [[ -n "${MUSICX_SIGNING_KEYCHAIN:-}" ]]; then security delete-keychain "$MUSICX_SIGNING_KEYCHAIN"; fi
          rm -rf "$RUNNER_TEMP/musicx-signing"

  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      SOURCE_SHA: ${{ needs.plan.outputs.source-sha }}
      RELEASE_BRANCH: ${{ needs.plan.outputs.branch }}
      RELEASE_ARTIFACTS: target/distribution
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source-sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.13.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-plan
          path: target/release-plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: musicx-macos-validated
          path: target/distribution
      - name: Create semantic tag and publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          MUSICX_SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: node scripts/semantic-release/run.mjs publish
      - name: Preserve the publication receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-manifest-macos-${{ github.run_attempt }}
          path: target/distribution/release-manifest.json
          if-no-files-found: warn
          retention-days: 90

  testflight:
    needs: plan
    if: needs.plan.outputs.release == 'true' && needs.plan.outputs.branch == 'main'
    runs-on: macos-15
    timeout-minutes: 60
    environment: macos-testflight
    permissions:
      contents: read
      actions: read
    env:
      SOURCE_SHA: ${{ needs.plan.outputs.source-sha }}
      RELEASE_BRANCH: ${{ needs.plan.outputs.branch }}
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source-sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.13.0'
      - name: Verify the pinned App Store toolchain
        run: xcodebuild -version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-plan
          path: target/release-plan
      - run: python3 scripts/release-artifacts.py env
      - id: saved
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/find-release-artifact.py musicx-testflight
      - if: steps.saved.outputs.exists == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ steps.saved.outputs.id }}
          path: target/testflight
      - if: steps.saved.outputs.exists != 'true'
        run: rustup toolchain install --no-self-update
      - name: Import App Store distribution identities
        if: steps.saved.outputs.exists != 'true'
        env:
          STORE_APP_CERTIFICATE: ${{ secrets.STORE_APP_CERTIFICATE }}
          STORE_APP_CERTIFICATE_PASSWORD: ${{ secrets.STORE_APP_CERTIFICATE_PASSWORD }}
          STORE_INSTALLER_CERTIFICATE: ${{ secrets.STORE_INSTALLER_CERTIFICATE }}
          STORE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.STORE_INSTALLER_CERTIFICATE_PASSWORD }}
          STORE_PROVISION_PROFILE: ${{ secrets.STORE_PROVISION_PROFILE }}
        run: python3 scripts/import-release-signing.py testflight
      - name: Package sandboxed TestFlight installer
        if: steps.saved.outputs.exists != 'true'
        env:
          MUSICX_ICLOUD_CONTAINER: ${{ vars.MUSICX_ICLOUD_CONTAINER }}
        run: |
          python3 scripts/package-testflight-macos.py --output target/testflight/MusicX.pkg \
            --version "$MUSICX_SHORT_VERSION" --build "$MUSICX_BUNDLE_VERSION" \
            --profile "$STORE_PROFILE_PATH" --app-identity "$STORE_APP_IDENTITY" \
            --installer-identity "$STORE_INSTALLER_IDENTITY" --keychain "$MUSICX_SIGNING_KEYCHAIN"
      - if: steps.saved.outputs.exists != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: musicx-testflight
          path: target/testflight/MusicX.pkg*
          compression-level: 0
          if-no-files-found: error
          retention-days: 90
      - name: Upload and verify Internal TestFlight availability
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TESTFLIGHT_APP_ID: ${{ vars.TESTFLIGHT_APP_ID }}
          TESTFLIGHT_GROUP_ID: ${{ vars.TESTFLIGHT_GROUP_ID }}
        run: python3 scripts/publish-testflight.py target/testflight/MusicX.pkg
      - name: Preserve TestFlight status
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: testflight-status-${{ github.run_attempt }}
          path: target/testflight/testflight-status.json
          if-no-files-found: warn
          retention-days: 90
      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          if [[ -n "${MUSICX_SIGNING_KEYCHAIN:-}" ]]; then security delete-keychain "$MUSICX_SIGNING_KEYCHAIN"; fi
          rm -rf "$RUNNER_TEMP/musicx-signing"
