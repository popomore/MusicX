name: Site

on:
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
  push:
    branches: [main]
    tags: ['site-v*']
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable site-vX.Y.Z tag to verify without deployment
        type: string
        required: true

permissions:
  contents: read

jobs:
  check:
    name: Site checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      target_environment: ${{ steps.source.outputs.target_environment }}
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release source
        id: source
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: bash scripts/release-environment.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run check:deploy
        env:
          WRANGLER_SEND_METRICS: 'false'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: site-dist
          path: site/dist
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy site
    needs: check
    if: github.event_name == 'push' && github.repository == 'popomore/MusicX'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ needs.check.outputs.target_environment }}
    concurrency:
      group: deploy-site-${{ needs.check.outputs.target_environment }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: site/dist
      - name: Deploy the checked static build
        env:
          TARGET_ENVIRONMENT: ${{ needs.check.outputs.target_environment }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN' >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID' >&2; exit 1; }
          npm exec -- wrangler deploy --env "$TARGET_ENVIRONMENT"
