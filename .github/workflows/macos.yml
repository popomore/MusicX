name: macOS Build and Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_INCREMENTAL: '0'
  MACOSX_DEPLOYMENT_TARGET: '14.0'
  DMG: target/distribution/MusicX-macos-arm64.dmg

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt
          rustup override set 1.97.0

      - name: Validate release tag
        if: github.ref_type == 'tag'
        run: |
          git merge-base --is-ancestor HEAD origin/main
          version=$(cargo metadata --locked --no-deps --format-version 1 |
            jq -er '.packages[] | select(.name == "mini-cloudmusic") | .version')
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ || "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Use a vMAJOR.MINOR.PATCH tag matching apps/macos/helper/Cargo.toml."
            exit 1
          fi

      - name: Format and test
        run: |
          cargo fmt --all -- --check
          cargo test --release --locked --workspace

      - name: Import Developer ID certificate
        if: github.ref_type == 'tag'
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          : "${APPLE_DEVELOPER_ID_P12_BASE64:?Configure the Developer ID certificate secret}"
          : "${APPLE_DEVELOPER_ID_P12_PASSWORD:?Configure the Developer ID certificate password secret}"
          umask 077
          certificate=$(mktemp "$RUNNER_TEMP/musicx-certificate.XXXXXX")
          trap 'rm -f "$certificate"' EXIT
          printf '%s' "$APPLE_DEVELOPER_ID_P12_BASE64" | base64 --decode > "$certificate"

          keychain="$RUNNER_TEMP/musicx-signing.keychain-db"
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate" -f pkcs12 -k "$keychain" -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain"

          identity=$(security find-identity -v -p codesigning "$keychain" |
            awk '/"Developer ID Application: / {print $2}')
          if [[ ! "$identity" =~ ^[0-9A-Fa-f]{40}$ ]]; then
            echo "::error::The certificate must provide exactly one valid Developer ID Application identity."
            exit 1
          fi
          printf 'MUSICX_CODESIGN_IDENTITY=%s\n' "$identity" >> "$GITHUB_ENV"

      - name: Package Apple Silicon DMG
        run: |
          test "$(uname -m)" = arm64
          sh scripts/package-macos.sh "$DMG"
          hdiutil verify -quiet "$DMG"

      - name: Notarize and staple the DMG
        if: github.ref_type == 'tag'
        env:
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          : "${APPLE_NOTARY_KEY_BASE64:?Configure the notarization API key secret}"
          : "${APPLE_NOTARY_KEY_ID:?Configure the notarization key ID secret}"
          : "${APPLE_NOTARY_ISSUER_ID:?Configure the notarization issuer ID secret}"
          umask 077
          notary_dir=$(mktemp -d "$RUNNER_TEMP/musicx-notary.XXXXXX")
          trap 'rm -rf "$notary_dir"' EXIT
          printf '%s' "$APPLE_NOTARY_KEY_BASE64" | base64 --decode > "$notary_dir/key.p8"
          xcrun notarytool submit "$DMG" \
            --key "$notary_dir/key.p8" --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait --timeout 20m --output-format json > "$notary_dir/result.json"
          jq -er '.status' "$notary_dir/result.json"
          jq -e '.status == "Accepted"' "$notary_dir/result.json" > /dev/null
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Write checksum
        run: |
          cd "$(dirname "$DMG")"
          name=$(basename "$DMG")
          shasum -a 256 "$name" > "$name.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MusicX-macos-arm64
          path: |
            ${{ env.DMG }}
            ${{ env.DMG }}.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: MusicX-macos-arm64
          path: dist

      - name: Publish GitHub Release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum --check MusicX-macos-arm64.dmg.sha256
          gh release create "$GITHUB_REF_NAME" \
            MusicX-macos-arm64.dmg MusicX-macos-arm64.dmg.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "MusicX ${GITHUB_REF_NAME#v}"
