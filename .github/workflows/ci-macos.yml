name: macOS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'
  MACOSX_DEPLOYMENT_TARGET: '14.0'

jobs:
  release-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test release automation
        run: python3 -m unittest discover -s scripts/tests -v

  test:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt
          rustup override set 1.97.0

      - name: Format and test
        run: |
          cargo fmt --all -- --check
          cargo test --release --locked --workspace
