name: macOS CI

on:
  pull_request:
    branches: [main, release, '[0-9]*.x']
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main, release, '[0-9]*.x']

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'
  MACOSX_DEPLOYMENT_TARGET: '14.0'

jobs:
  commit-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Fetch metadata as JSON and apply trusted base rules
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/commits?per_page=100" |
            jq 'add' > "$RUNNER_TEMP/commits.json"
          if [[ -f scripts/commit-policy.py ]]; then
            python3 scripts/commit-policy.py "$RUNNER_TEMP/pr.json" "$RUNNER_TEMP/commits.json"
          else
            # One-time bootstrap: base predates this policy. No PR code is executed.
            python3 - "$RUNNER_TEMP/pr.json" "$RUNNER_TEMP/commits.json" <<'PY'
          import json, re, sys
          pr = json.load(open(sys.argv[1]))
          commits = json.load(open(sys.argv[2]))
          pattern = r'^(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)(\([a-z0-9][a-z0-9._/-]*\))?!?: .+$'
          for message in [pr['title'], *(c['commit']['message'] for c in commits if len(c['parents']) == 1)]:
              lines = message.splitlines()
              if (not lines or not re.fullmatch(pattern, lines[0]) or len(lines[0]) > 100
                      or (len(lines) > 1 and lines[1])
                      or re.search(r'[\u3400-\u9fff\u3040-\u30ff\uac00-\ud7af]', message)):
                  raise SystemExit('Use English Conventional Commits in the PR title and handwritten commits')
          PY
          fi

  release-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.13.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test release automation
        run: |
          python3 -m unittest discover -s scripts/tests -v
          npm test

  test:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # CI tests don't need the release profile's size optimization and LTO.
      CARGO_PROFILE_TEST_DEBUG: '0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install --no-self-update

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          env-vars: 'CARGO CC CFLAGS CXX CMAKE RUST MACOSX_DEPLOYMENT_TARGET'

      - name: Test workspace
        run: cargo test --locked --workspace

      - name: Check iOS workspace lockfile
        working-directory: apps/ios
        run: cargo metadata --locked --format-version 1 > /dev/null
