name: macOS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'
  MACOSX_DEPLOYMENT_TARGET: '14.0'

jobs:
  release-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test release automation
        run: python3 -m unittest discover -s scripts/tests -v

  test:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # CI tests don't need the release profile's size optimization and LTO.
      CARGO_PROFILE_TEST_DEBUG: '0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install --no-self-update

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          env-vars: 'CARGO CC CFLAGS CXX CMAKE RUST MACOSX_DEPLOYMENT_TARGET'

      - name: Test workspace
        run: cargo test --locked --workspace

      - name: Check iOS workspace lockfile
        working-directory: apps/ios
        run: cargo metadata --locked --format-version 1 > /dev/null
