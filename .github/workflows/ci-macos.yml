name: macOS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'
  MACOSX_DEPLOYMENT_TARGET: '14.0'
  DMG: target/distribution/MusicX-macos-arm64.dmg

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt
          rustup override set 1.97.0

      - name: Format and test
        run: |
          cargo fmt --all -- --check
          cargo test --release --locked --workspace

      - name: Package Apple Silicon DMG
        run: |
          test "$(uname -m)" = arm64
          sh scripts/package-macos.sh "$DMG"
          hdiutil verify -quiet "$DMG"

      - name: Write checksum
        run: |
          cd "$(dirname "$DMG")"
          name=$(basename "$DMG")
          shasum -a 256 "$name" > "$name.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MusicX-macos-arm64
          path: |
            ${{ env.DMG }}
            ${{ env.DMG }}.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
