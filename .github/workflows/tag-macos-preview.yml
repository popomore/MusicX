name: Queue macOS Release

on:
  workflow_run:
    workflows: [macOS CI]
    types: [completed]
    branches: [main, release, '[0-9]*.x']

permissions: {}

jobs:
  dispatch:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      # workflow_run executes trusted default-branch code; never checkout PR heads.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Verify the successful push and dispatch its own branch
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 scripts/release-source.py "$CI_RUN_ID" --dispatch
