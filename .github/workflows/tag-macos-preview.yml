name: Tag macOS Preview

on:
  workflow_run:
    workflows: [macOS CI]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  tag:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: tag-macos-preview-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Create preview tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ -f scripts/release-tag.sh ]]; then
            bash scripts/create-preview-tag.sh
          else
            echo 'This commit predates the tag-driven release workflow.'
          fi

      - name: Dispatch release for the preview tag
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_TAG: ${{ steps.tag.outputs.tag }}
        run: gh workflow run release-macos.yml --repo "$GITHUB_REPOSITORY" --ref "$PREVIEW_TAG"
