[package]
name = "musicx-core"
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
publish = false

[dependencies]
musicx-protocol = { path = "../protocol" }
musicx-plugin-api = { path = "../plugin-api" }
anyhow = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
hex = "0.4"
rand = "0.8"
url = "2"
tokio = { version = "1", features = ["sync"] }
