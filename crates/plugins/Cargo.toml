[package]
name = "musicx-plugins"
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
publish = false

[dependencies]
musicx-core = { path = "../core" }
musicx-plugin-api = { path = "../plugin-api" }
anyhow = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["blocking", "form", "json", "query"] }
aes = "0.8"
base64 = "0.22"
hex = "0.4"
md-5 = "0.10"
sha2 = "0.10"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rquickjs = "=0.14.0"
url = "2"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(target_os = "ios")'.dependencies]
rquickjs = { version = "=0.14.0", features = ["bindgen"] }
