[package]
name = "musicx-protocol"
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version.workspace = true
publish = false

[features]
schema = ["dep:schemars"]

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
schemars = { version = "1", optional = true }

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSLocale", "NSString"] }
