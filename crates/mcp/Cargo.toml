[package]
name = "musicx-mcp"
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.97"
publish = false

[dependencies]
musicx-core = { path = "../core" }
musicx-plugin-api = { path = "../plugin-api" }
musicx-protocol = { path = "../protocol", features = ["schema"] }
musicx-plugins = { path = "../plugins" }
anyhow = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
rmcp = { version = "1.8", features = ["server", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
axum = "0.8"
