[package]
name = "musicx-mcp"
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version.workspace = true
publish = false

[dependencies]
musicx-core = { path = "../core" }
musicx-plugin = { path = "../plugin" }
musicx-protocol = { path = "../protocol", features = ["schema"] }
anyhow = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
rmcp = { version = "1.8", features = ["server", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
axum = "0.8"
