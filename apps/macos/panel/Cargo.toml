[package]
name = "musicx-panel"
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version.workspace = true
publish = false

[[test]]
name = "window_lifecycle"
harness = false

[[test]]
name = "localization"
harness = false

[[test]]
name = "notices"
harness = false

[dependencies]
musicx-protocol = { path = "../../../crates/protocol" }
nsh-core = "=0.4.0"
nsh-base = { version = "=0.4.0", default-features = false }
nsh-platform-macos = { path = "../../../vendor/nsh-platform-macos", default-features = false }
objc2 = "0.6"
objc2-foundation = "0.3"
dispatch2 = "0.3"
anyhow = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
musicx-platform-apple = { path = "../../../crates/platform-apple" }
nsh-engine = { version = "=0.4.0", default-features = false }
nsh-testing = { version = "=0.4.0", default-features = false }
