[package]
name = "mini-cloudmusic-panel"
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
publish = false

[dependencies]
musicx-protocol = { path = "../../../crates/protocol" }
nsh-core = "=0.4.0"
nsh-base = { version = "=0.4.0", default-features = false }
nsh-platform-macos = { path = "../../../vendor/nsh-platform-macos", default-features = false }
objc2 = "0.6"
objc2-foundation = "0.3"
dispatch2 = "0.3"
anyhow = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"] }
tokio = { version = "1", features = ["sync"] }
