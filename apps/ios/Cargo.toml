[package]
name = "musicx-iphone"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
autobins = false

[workspace]

[dependencies]
nsh-core = "=0.4.0"
nsh-base = { version = "=0.4.0", default-features = false }
musicx-core = { path = "../../crates/core" }
anyhow = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
tokio = { version = "1", features = ["sync"] }

[target.'cfg(target_os = "ios")'.dependencies]
musicx-mcp = { path = "../../crates/mcp" }
musicx-platform-apple = { path = "../../crates/platform-apple" }
musicx-plugins = { path = "../../crates/plugins" }
nsh-platform-ios = { version = "=0.4.0", default-features = false }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
